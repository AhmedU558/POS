# Full-stack overlay: API + Next.js on top of the local postgres/redis services.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# The base compose file stays backing-services-only so `docker compose up -d` keeps
# the fast local rebuild loop described there.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pos-backend:local
    container_name: pos-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME:-}
      APP_BOOTSTRAP_FIRST_NAME: ${APP_BOOTSTRAP_FIRST_NAME:-}
      APP_BOOTSTRAP_LAST_NAME: ${APP_BOOTSTRAP_LAST_NAME:-}
      APP_BOOTSTRAP_EMAIL: ${APP_BOOTSTRAP_EMAIL:-}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    image: pos-frontend:local
    container_name: pos-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    command: ["npm", "run", "start", "--", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
