spring:
  application:
    name: pos-backend-test
  datasource:
    # Connection details are supplied at runtime by the PostgreSQL Testcontainer through
    # @ServiceConnection (see com.pos.TestcontainersConfiguration). A value is declared here
    # only so the required-property placeholder in application.yml resolves during binding.
    password: testcontainers
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    cors:
      allowed-origins: http://localhost:3000

jwt:
  # Non-production fixtures. Required because RequiredConfigurationValidator makes the signing
  # secrets mandatory at startup. These are deliberately obvious placeholders, long enough only
  # to clear the configuration-hygiene floor; nothing signs or verifies a token in Phase 0.
  secret: test-fixture-not-a-real-secret-value-0001
  refresh-secret: test-fixture-not-a-real-secret-value-0002
